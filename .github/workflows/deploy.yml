name: deploy

# Deploys the in-Fabric demo (deploy.py) with the SAME OIDC identity the build legs use: duckrun
# mints the storage, Fabric and Power BI tokens from the GitHub assertion, so there is no login
# step, exactly as on the duckrun leg. Manual: deploying items and scheduling a notebook that
# spends capacity every 12 h is a deliberate act.
#
# Deploy an engine's model only after that engine has built at least once (pipeline.yml): a
# Direct Lake model reframes on deploy and needs <engine>_mart.fct_summary to exist.

on:
  workflow_dispatch:
    inputs:
      engine:
        description: The engine the scheduled notebook builds and the semantic model binds to
        type: choice
        default: iceberg
        options: [duckrun, iceberg, ducklake, dwh, spark]
      full:
        description: Also deploy the notebook, variable library and pipeline, and schedule it every 12 h
        type: boolean
        default: false
      model:
        description: Deploy the semantic model aemo_<engine> (the engine must have built once)
        type: boolean
        default: true
      dbt_schema:
        description: DBT_SCHEMA the engine was built with — 'mart' binds the model to <engine>_mart, anything else to <value>_<engine>_mart
        type: string
        default: mart

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      DBT_SCHEMA: ${{ inputs.dbt_schema }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/duckrun.txt
      # duckrun is the whole backend; provision.py's `requests` comes with it.
      - run: pip install -r requirements/duckrun.txt
      - name: Deploy ${{ inputs.engine }}
        run: >
          python deploy.py --engine "${{ inputs.engine }}"
          ${{ inputs.full && '--full' || '' }}
          ${{ !inputs.model && '--no-model' || '' }}
