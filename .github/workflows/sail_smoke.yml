name: sail smoke (candidate engine)

# A FEASIBILITY PROBE, NOT A LEG. It builds nothing this repo depends on, it is not in
# pipeline.yml, and it never gates anything — `continue-on-error: true` and the script exits 0
# whatever it finds, because a red result is the point: it becomes the upstream bug report.
#
# THE QUESTION. LakeSail's `dbt-sail` is a thin wrapper around dbt-spark talking Spark Connect
# to Sail, a Rust Spark replacement with no JVM, and Sail has a native OneLake catalog that
# takes the same Entra bearer token the iceberg leg already mints. That would make a sixth
# engine: a second Iceberg writer against the same gold layer, on an engine that is neither
# DuckDB nor JVM Spark. CREATE TABLE through that catalog is confirmed working by hand; MERGE
# INTO is not, and every fact model here is an incremental merge on a unique key. This job
# measures that, plus whether `show table extended` lists anything — which is how dbt-spark
# decides an incremental model already exists, and an empty answer there is worse than an
# error.
#
# workflow_dispatch ONLY. No push trigger, no call from pipeline.yml: it touches Fabric, so it
# costs capacity, and it should cost it only when somebody asks.
#
# NOTHING IN THE FIVE-ENGINE LAYOUT IS TOUCHED by this job, and it PROVISIONS NOTHING. The
# shared `dbt` lakehouse is assumed to be there already — every real leg creates it, and a
# probe has no business creating Fabric items to answer a question about SQL support. So the
# catalog url is composed from the workspace secret and the lakehouse's known name rather
# than resolved through the Fabric API: no provision.py, no `requests`, no item lookups,
# one `az` token and nothing else.
#
# That also keeps a `sail` key out of provision.py's ENGINES, which is the five-engine
# contract check_gating.py and deploy.py key off.

on:
  workflow_dispatch:
    inputs:
      schema:
        description: Schema to build the probe tables in. Deliberately outside the <engine>_landing / <engine>_mart namespace the five engines share.
        required: false
        default: sail_smoke
        type: string
      keep:
        description: Leave the probe tables behind for inspection in Fabric instead of dropping them.
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The whole job is best-effort. A failure here is a finding about Sail, not a broken repo.
    continue-on-error: true
    env:
      SAIL_SMOKE_SCHEMA: ${{ inputs.schema }}
      SAIL_SMOKE_KEEP: ${{ inputs.keep && '1' || '0' }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # pysail publishes for 3.10-3.14; 3.12 keeps this on the same interpreter as every
          # other job in the repo.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/sail_smoke.txt

      - run: pip install -r requirements/sail_smoke.txt

      # The ONLY thing this job asks Azure for. Not duckrun, so it cannot mint its own
      # OneLake token off the OIDC assertion the way that leg does — it needs a real `az`
      # session for the step below, and for nothing else.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint OneLake token
        # storage.azure.com, the same audience dbt2/profiles.yml hands the Iceberg REST
        # catalog and the same one build.yml's compact job mints. Sail's OneLake catalog takes
        # a bearer token and explicitly will NOT take an account key or a SAS.
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve the dbt lakehouse
        # GUID/GUID. Sail's OneLake catalog url is documented as <workspace>/<item>.<type>,
        # but the item resolves by id -- the same "{workspace_id}/{lakehouse_id}" the iceberg
        # leg hands the REST endpoint. A name there does not resolve.
        #
        # ONE GET, AND IT CREATES NOTHING. `dbt` is the shared lakehouse every real leg makes;
        # a probe about SQL support has no business provisioning Fabric items, so if it is not
        # there this fails loudly rather than conjuring one.
        run: |
          T=$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)
          ID=$(curl -sf -H "Authorization: Bearer $T"                  "https://api.fabric.microsoft.com/v1/workspaces/$FABRIC_WORKSPACE_ID/lakehouses"                | jq -r '.value[] | select(.displayName=="dbt") | .id')
          if [ -z "$ID" ]; then
            echo "::error::no lakehouse named 'dbt' in this workspace -- run a real leg first"
            exit 1
          fi
          echo "resolved dbt lakehouse: $ID"
          echo "WAREHOUSE_PATH=$FABRIC_WORKSPACE_ID/$ID" >> "$GITHUB_ENV"
          # And the LANDING zone, for phase B. The AEMO CSVs the probe reads are the ones
          # download_aemo.py actually landed -- ragged, quoted, many record types per file --
          # because a CSV this script wrote itself would prove nothing about the real shape.
          # A missing landing lakehouse is not fatal: the probe reports those three as SKIP.
          LID=$(curl -sf -H "Authorization: Bearer $T" \
                  "https://api.fabric.microsoft.com/v1/workspaces/$FABRIC_WORKSPACE_ID/lakehouses" \
                | jq -r '.value[] | select(.displayName=="dbt_landing") | .id')
          if [ -n "$LID" ]; then
            echo "resolved dbt_landing lakehouse: $LID"
            echo "LANDING_PATH=abfss://$FABRIC_WORKSPACE_ID@onelake.dfs.fabric.microsoft.com/$LID/Files" >> "$GITHUB_ENV"
          else
            echo "::warning::no lakehouse named 'dbt_landing' -- the CSV probes will SKIP"
          fi

      - name: Probe Sail
        # A BACKSTOP, not the fix. sail_smoke.py ends itself with os._exit because the
        # embedded Sail server's threads otherwise keep the process alive after the report is
        # printed. If that ever stops working, this bounds the damage at 10 minutes instead of
        # the job's 30 -- and the probes themselves take well under a minute.
        timeout-minutes: 10
        run: python .github/scripts/sail_smoke.py 2>&1 | tee sail_smoke.log

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          # This log IS the deliverable — it is the body of the issue for lakehq/sail or
          # lakehq/dbt-sail if something did not work.
          name: sail-smoke-log
          path: sail_smoke.log
          if-no-files-found: warn
