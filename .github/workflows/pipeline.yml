name: pipeline

# Display only. The run page's title, instead of "pipeline #NN" -- what this run actually is,
# legible in a screenshot without reading the inputs.
run-name: pipeline — ${{ inputs.engines == 'all' && 'all five engines' || inputs.engines }}, one gold layer

# Builds the same models on every engine, proves they agree, and writes down what the run
# touched and what it wrote (history/runs/); the Capacity units workflow then adds what it cost.
#
# Manual only. Deploying Fabric items and spending capacity is a deliberate act, and the
# record job commits to history/ (the run record and the parity fingerprints), so a push
# trigger would make the commit start the next run. A push made with GITHUB_TOKEN triggers
# nothing, which is what makes committing from here safe today; NEVER add a push: trigger
# here or to capacity.yml -- tests_py/test_parity_record.py pins the trigger set.

on:
  workflow_dispatch:
    inputs:
      engines:
        description: Which engines to build
        type: choice
        default: all
        options: [all, duckrun, iceberg, ducklake, dwh, spark]
      dbt_schema:
        description: DBT_SCHEMA — leave as 'mart' for production (schemas are <engine>_landing / <engine>_mart), or set e.g. 'test' to land the whole run in test_<engine>_landing / test_<engine>_mart instead
        type: string
        default: mart
      download_limit:
        description: Intraday files per feed per run (nemweb throttles bursts)
        type: string
        default: "6"
      daily_download_limit:
        description: Daily archive files per run (backfilled from GitHub, so a higher limit is safe)
        type: string
        default: "60"
      spark_resource_profile:
        description: readHeavyForPBI (V-Order on, Power BI-facing layout) or writeHeavy (the Fabric workspace default)
        type: choice
        default: readHeavyForPBI
        options: [readHeavyForPBI, writeHeavy]
      process_limit:
        description: Files each fact model folds per run, oldest first (every engine honours it; a backlog converges over runs). The throttle for spark's first build.
        type: string
        default: "1000"
      fabric_cores:
        description: vCores for the in-Fabric notebook legs (duckrun, ducklake, iceberg). 8 is the steady-state size; a from-scratch rebuild of the whole daily archive OOM-kills the notebook at 8 and needs 16.
        type: choice
        default: "8"
        options: ["4", "8", "16", "32"]
      local_runner:
        description: Build duckrun and iceberg on the GitHub runner instead of a Fabric notebook. The only way to prove the iceberg leg's credential vending works on an `az`-minted token, since inside Fabric notebookutils injects one at runtime. A VERIFICATION MODE — the runner has 7 GB, so pair it with a small process_limit. ducklake ignores this and always goes to Fabric.
        type: boolean
        default: false
      deploy:
        description: Deploy the in-Fabric demo after the build? (the items are always provisioned) none = skip; no_model = everything except the semantic models; full = everything
        type: choice
        default: none
        options: [none, no_model, full]

permissions:
  id-token: write
  contents: write

concurrency:
  # Never two of these against one workspace. NOT cancel-in-progress: cancelling a GitHub
  # job does not stop Fabric — the notebook or Livy session keeps running, and billing.
  group: pipeline-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Free gate. Nothing spends capacity until the gating is proven correct, because a
  # broken gate builds nothing and still reports success.
  checks:
    uses: ./.github/workflows/ci.yml

  plan:
    name: plan engines
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.pick.outputs.engines }}
    steps:
      - id: pick
        # A GitHub matrix cannot be filtered by an input, so the list is computed here.
        #
        # Each entry is {engine, label}. `engine` is the real target name and is what every
        # file in the repo keys on — do NOT rename those. `label` is cosmetic: it is the only
        # thing the Actions UI shows, and it names the STACK rather than the adapter package,
        # because "duckrun" and "iceberg" say nothing about what is underneath them. Three
        # DuckDB legs and two Fabric-native ones, in that shape so the graph groups them; the
        # same five labels are in ci.yml's gating matrix and in layout.py's LABEL, and the
        # three are meant to match. Emoji render fine in a job name, and UTF-8 passes through
        # the shell and jq below untouched. 🏢/⚡ rather than 🏛/🗲: those two have no default
        # emoji presentation and can come out as monochrome text glyphs.
        run: |
          ALL='[{"engine":"duckrun","label":"🦆 duckdb · delta-rs"},
                {"engine":"iceberg","label":"🧊 duckdb · iceberg"},
                {"engine":"ducklake","label":"🌊 duckdb · ducklake"},
                {"engine":"dwh","label":"🏢 fabric · warehouse"},
                {"engine":"spark","label":"⚡ fabric · spark"}]'
          if [ "${{ inputs.engines }}" = "all" ]; then
            echo "engines=$(echo "$ALL" | jq -c .)" >> "$GITHUB_OUTPUT"
          else
            echo "engines=$(echo "$ALL" | jq -c --arg e '${{ inputs.engines }}' '[.[]|select(.engine==$e)]')" >> "$GITHUB_OUTPUT"
          fi

  # LAND ONCE, HERE, so the five build legs can run at the same time.
  #
  # download_aemo.py rewrites csv_raw_archive_log.parquet with a delete-then-copy; five legs
  # landing concurrently would race on that single file and would also each re-fetch the same
  # nemweb archives. That race — not the warehouse — is what used to force max-parallel: 1.
  #
  # It also removes a second race: this job provisions the folder, dbt_landing and the shared
  # dbt lakehouse up front, so the parallel legs all find them already there instead of five
  # create-if-missing calls colliding on the same item name.
  #
  # No azure/login: duckrun mints its own tokens from the GitHub OIDC assertion.
  land:
    name: land AEMO (once)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # What the compact job needs from here. $GITHUB_ENV does not cross jobs; a job output does,
    # and it saves that job re-running provision.py (three Fabric REST calls and a duckrun
    # install) to look up a GUID this job already resolved. It has to come from THIS job and not
    # from `build`: `build` is a matrix, and matrix entries overwrite one another's outputs.
    # provision.py emits DATA_LAKEHOUSE_ID for every engine — the `dbt` lakehouse is shared by
    # all five — so the value here is the same one every leg resolves.
    #
    # The lakehouse GUID ALONE: GitHub drops any output that contains a secret ("Skip output ...
    # since it may contain secret"), and the full warehouse path starts with FABRIC_WORKSPACE_ID.
    outputs:
      data_lakehouse_id: ${{ steps.lakehouse.outputs.data_lakehouse_id }}
    env:
      download_limit: ${{ inputs.download_limit }}
      daily_download_limit: ${{ inputs.daily_download_limit }}
      # The dispatch inputs, as `record.py init` writes them into the run record. Blank = absent.
      RUNIN_ENGINES: ${{ inputs.engines }}
      RUNIN_DBT_SCHEMA: ${{ inputs.dbt_schema }}
      RUNIN_PROCESS_LIMIT: ${{ inputs.process_limit }}
      RUNIN_SPARK_RESOURCE_PROFILE: ${{ inputs.spark_resource_profile }}
      RUNIN_DOWNLOAD_LIMIT: ${{ inputs.download_limit }}
      RUNIN_DAILY_DOWNLOAD_LIMIT: ${{ inputs.daily_download_limit }}
      # Load-bearing for reading the record afterwards, not decoration: a local leg writes no
      # notebook GUID, so measure_cu.py skips it and the leg is ABSENT from cu.json rather than
      # zero. This is the only thing that says why.
      RUNIN_LOCAL_RUNNER: ${{ inputs.local_runner }}
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      # 5000 req/h authenticated against 60 anonymous, and runners share IPs.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/duckrun.txt
      # The run record starts here -- run id, sha, inputs -- and provision.py adds the shared
      # items' GUIDs to the same fragment. record.py; the record job merges every job's.
      # A step, not job env: the `runner` context is not available at job level.
      - name: Open the run record
        run: |
          echo "RUN_RECORD=$RUNNER_TEMP/record/record-00-run.json" >> "$GITHUB_ENV"
          RUN_RECORD="$RUNNER_TEMP/record/record-00-run.json" python .github/scripts/record.py init
      - name: Provision the shared items
        run: python .github/scripts/provision.py duckrun >> "$GITHUB_ENV"
      - name: Expose the shared lakehouse to the compact job
        id: lakehouse
        run: echo "data_lakehouse_id=$DATA_LAKEHOUSE_ID" >> "$GITHUB_OUTPUT"
      - name: Land AEMO files
        run: python download_aemo.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: record-fragment-00-run
          path: ${{ runner.temp }}/record/
          if-no-files-found: ignore

  # ONE LEG PER ENGINE: build it, test it, fingerprint its gold table. Landing already happened
  # ONCE, above, which is the only reason these can run at the same time.
  #
  # WHERE dbt RUNS depends on the engine:
  #
  #   duckrun, ducklake, iceberg   ON FABRIC COMPUTE (FABRIC_CORES vCores), through duckrun's
  #                                run_python -- .github/scripts/remote_dbt.py. DuckDB folds the
  #                                AEMO archive in memory, and the 7 GB hosted runner was shut
  #                                down mid-fct_scada twice in one day ("The runner has received
  #                                a shutdown signal"). The original delta repo never ran dbt on
  #                                the runner either ("the runner pulls every byte across the
  #                                internet twice"). Here the runner only provisions, launches
  #                                and collects the log. Cancelling the GitHub job does NOT stop
  #                                the notebook -- it runs, and bills, to completion.
  #   dwh, spark                   on the runner. dbt is only a client there; the compute is the
  #                                Warehouse / the Livy session.
  #
  # Deliberately NO `--select` anywhere: model selection is entirely +enabled in
  # dbt_project.yml, keyed on the target name.
  build:
    needs: [plan, land]
    # Cosmetic only — `matrix.engine` below is still the real target name.
    name: build (${{ matrix.label }})
    strategy:
      # All five at once. They share one lakehouse but write separate schemas, and the
      # landing zone is already written by the `land` job above, so nothing is contended.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.engines) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The workflow-level block is `contents: write` for the record job's commit; a build leg
    # has no business with it.
    permissions:
      id-token: write
      contents: read
    env:
      ENGINE: ${{ matrix.engine }}
      # The legs whose dbt runs inside Fabric. Exact match on the list, not a substring.
      #
      # `local_runner` takes duckrun and iceberg off Fabric and onto this runner -- see that
      # input's description for why it exists. DUCKLAKE STAYS REMOTE EITHER WAY: only
      # run_in_fabric.py has the 40613 loop that waits out its auto-paused catalog SQL DB, and
      # the runner path below is a bare `dbt build || dbt retry` with nothing of the sort, so a
      # paused catalog would kill the leg at the ATTACH with no run_results.json to retry from.
      # Keeping it remote also means no DBT_ENV_SECRET_SQL_TOKEN has to be minted here.
      REMOTE: ${{ contains(fromJSON('["duckrun", "ducklake", "iceberg"]'), matrix.engine) && (!inputs.local_runner || matrix.engine == 'ducklake') }}
      # Stays a NUMBER whatever local_runner says: remote_dbt.py reads it as int(), and the
      # ducklake leg still launches a notebook with it. That is why `local` is not a value of
      # fabric_cores.
      FABRIC_CORES: ${{ inputs.fabric_cores }}
      DBT_SCHEMA: ${{ inputs.dbt_schema }}
      process_limit: ${{ inputs.process_limit }}
      SPARK_RESOURCE_PROFILE: ${{ inputs.spark_resource_profile }}
      # For anything DuckDB that still runs ON THE RUNNER (a local build of a DuckDB target):
      # off a Fabric notebook the azure extension needs the curl transport and the system CA
      # bundle. remote_dbt.py deliberately does not forward these into Fabric.
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      DUCKDB_TEMP_DIR: /tmp/duckdb_spill
      # dbt-fabricspark 1.13.0 runs OPTIMIZE after every Delta build, which rewrites the
      # layout the run just produced.
      DBT_FABRICSPARK_SKIP_OPTIMIZE: "true"
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      # An authenticated GitHub API call gets 5000 req/h against 60 anonymous, and runners
      # share IPs — without this the archive backfill listing hits the anonymous quota.
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          # Default glob is **/requirements.txt, which this repo has not got.
          cache-dependency-path: requirements/*.txt

      - name: Install ${{ matrix.engine }} dependencies
        # ONE list per engine, and the same one the notebook and the gating job install --
        # every leg is dbt-core 1.x now, so nothing needs a runner-only variant. iceberg had
        # a requirements/iceberg_runner.txt while it was dbt OSS 2, because dbt-oss and
        # duckrun cannot share an environment (duckrun pins dbt-core<2 and lays a 1.x `dbt`
        # script over v2's); dbt-duckdb and duckrun share one happily.
        # The compact job below still installs its own `--pre duckdb` and nothing else.
        run: pip install -r "requirements/${ENGINE}.txt"

      # ---- auth -------------------------------------------------------------------
      # duckrun — and ONLY duckrun — mints every token it needs (OneLake storage, Fabric
      # control plane) by exchanging a fresh GitHub OIDC assertion, so its leg needs no login
      # step. Every other engine gets an Azure session: provision.py falls back to `az` for
      # any audience duckrun cannot mint, and the dwh leg captures its Warehouse token below.
      - name: Azure login
        if: matrix.engine != 'duckrun'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # ---- the run record -------------------------------------------------------------
      # The fragment this leg writes (record.py): the items it touched, under their GUIDs, and
      # the leg's compute window. OUTSIDE the checkout, so no untracked file lands in the tree;
      # the record job below merges every job's fragment into history/runs/. A step, not job
      # env: the `runner` context is not available at job level.
      - name: Open the run-record fragment
        run: echo "RUN_RECORD=$RUNNER_TEMP/record/record-20-build-$ENGINE.json" >> "$GITHUB_ENV"

      # ---- provision ---------------------------------------------------------------
      - name: Provision Fabric items
        run: python .github/scripts/provision.py "$ENGINE" >> "$GITHUB_ENV"

      - name: Capture Warehouse SQL token
        if: matrix.engine == 'dwh'
        # Captured HERE, not lazily at dbt-run time: the OIDC client assertion lasts only
        # ~5 minutes, and provisioning above can outlive it. Without this the run dies at the
        # first model with AADSTS700024.
        run: |
          TOKEN=$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "FABRIC_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Mint OneLake token
        # Only for a LOCAL iceberg leg, and only because the notebook is what normally provides
        # it: remote_dbt.py's setup hook mints it in the kernel from notebookutils, so nothing
        # token-shaped travels. On the runner nothing does, and the profile's
        # env_var('ONELAKE_TOKEN') has NO default -- dbt dies at profile render without this.
        # The catalog bearer is now the leg's ONLY credential (storage is vended per table), so
        # this one line is the whole thing under test. Same incantation as the compact job.
        # duckrun needs nothing (it mints from the OIDC assertion and gets no azure/login);
        # ducklake never runs locally.
        if: env.REMOTE != 'true' && matrix.engine == 'iceberg'
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # NO LANDING STEP HERE, on purpose. download_aemo.py rewrites
      # csv_raw_archive_log.parquet with a delete-then-copy, so five legs landing at once would
      # race on that one file -- which is the only reason the legs used to be forced through
      # max-parallel: 1. The shared `land` job above is the one writer, and one landing zone for
      # every engine is also what makes the parity comparison below mean anything.

      # ---- the leg's window --------------------------------------------------------
      # `started` / `finished` bracket everything that spends Fabric compute -- build, tests
      # AND the fingerprint -- and are what measure_cu.py attributes this leg's capacity units
      # with, at the metrics model's hour grain. The items are persistent and shared here, so
      # the window is not optional: without it a GUID's CU is every run's CU. history/README.md.
      - name: Record leg start
        run: python .github/scripts/record.py leg-start "$ENGINE"

      # ---- build -------------------------------------------------------------------
      - name: dbt build on Fabric compute
        if: env.REMOTE == 'true'
        # build || retry, then the fingerprint, all inside one Fabric Python notebook; the
        # fingerprint is lifted out of the streamed log into history/parity/<engine>.json.
        run: python .github/scripts/remote_dbt.py "$ENGINE"

      - name: dbt build
        if: env.REMOTE != 'true'
        # dbt1/ is the only project. Normally the engines that reach this step are dwh and
        # spark, since the three DuckDB legs are in the REMOTE list and build inside the
        # notebook instead (.github/scripts/run_in_fabric.py) -- but `local_runner` sends
        # duckrun and iceberg here too, which is the point of that input.
        working-directory: dbt1
        # `dbt retry` needs --target too, or it renders the profile's default target.
        run: |
          dbt build --target "$ENGINE" --profiles-dir . \
            || dbt retry --target "$ENGINE" --profiles-dir .

      # ---- fingerprint -------------------------------------------------------------
      - name: Fingerprint gold layer
        if: env.REMOTE != 'true'
        working-directory: dbt1
        # parity.py is addressed through $GITHUB_WORKSPACE: this step's cwd is the project,
        # not the repo root, and the artifact path below is repo-relative.
        run: |
          dbt run-operation parity_fingerprint --target "$ENGINE" --profiles-dir . \
            | python "$GITHUB_WORKSPACE/.github/scripts/parity.py" capture "$GITHUB_WORKSPACE/history/parity"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: parity-${{ matrix.engine }}
          path: history/parity/${{ matrix.engine }}.json
          if-no-files-found: warn

      # AFTER the fingerprint, not after the build: on spark the run-operation opens a new
      # Livy session and on dwh it is a full Warehouse Query, both billed. The notebook legs
      # run it inside the notebook, i.e. inside their window either way. `job.status` is
      # already `failure` once any earlier step failed, so no step ids are needed.
      - name: Record leg end
        if: always()
        run: python .github/scripts/record.py leg-end "$ENGINE" "${{ job.status }}"

      # always(): a failed build still spent compute, and it still has to be attributable.
      # `ignore`: RUN_RECORD unset (or a leg that died before leg-start) is a no-op fragment,
      # not an error -- record.py logs what it assembled.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: record-fragment-build-${{ matrix.engine }}
          path: ${{ runner.temp }}/record/
          if-no-files-found: ignore

  # Iceberg accumulates small files and has no snapshot expiry, so compaction is a job of its
  # own. `needs` is for ORDERING only — never overlap a rewrite with a load, and never let the
  # `layout` job below measure a table mid-rewrite — and it must NOT gate on the build
  # succeeding: fragmentation is just as real after a failed build.
  #
  # It waits for ALL the legs, not just iceberg's, because a job cannot depend on one matrix
  # entry. That is the one thing lost by inlining the leg here rather than in a reusable
  # workflow of its own, and it costs wall-clock only.
  compact:
    name: compact iceberg
    if: ${{ (inputs.engines == 'all' || inputs.engines == 'iceberg') && !cancelled() }}
    needs: [land, build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    env:
      COMPACT_BUDGET_MINUTES: "70"
      COMPACT_MIN_INPUT_FILES: "5"
      PYTHONUNBUFFERED: "1"
      # Separate job, so $GITHUB_ENV from the legs does not reach it. Without this the script
      # would resolve iceberg_landing/iceberg_mart while the run built into
      # test_iceberg_landing/test_iceberg_mart, and report a tidy catalog having compacted
      # nothing.
      DBT_SCHEMA: ${{ inputs.dbt_schema }}
      # Which lakehouse, from the `land` job's provisioning (its job output); the script
      # composes the catalog's warehouse path as <workspace>/<lakehouse>.
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      DATA_LAKEHOUSE_ID: ${{ needs.land.outputs.data_lakehouse_id }}
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Just the engine. iceberg_rewrite_data_files() exists on the pre-release line only,
      # and this job never invokes dbt, duckrun or the Fabric API -- it is a metadata rewrite
      # against the catalog on the token below.
      - run: pip install --pre duckdb
      # For the token only. The OneLake token is the REST catalog's bearer; storage
      # credentials are vended by the catalog per table (compact_iceberg.py).
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Compact
        # A run that died before `land` provisioned has no catalog location to hand over; there
        # is nothing to compact then either. Say so instead of failing on a missing env var.
        run: |
          if [ -z "$DATA_LAKEHOUSE_ID" ]; then
            echo "::warning::the land job did not resolve the lakehouse (failed before provisioning); nothing compacted"
            exit 0
          fi
          python .github/scripts/compact_iceberg.py

  # WHAT EACH ENGINE WROTE. layout.py reads every engine's tables back through Delta with
  # duckrun.get_stats() -- rows, files, row groups, size, compression -- plus fct_summary's
  # per-column encodings, row-group ordering and run lengths, and puts the engines side by
  # side in the step summary and in the run record under `layout`. It only READS.
  #
  # Best-effort by construction (continue-on-error here, try/except per engine inside): a
  # table that cannot be read is "not measured", never a red run, and the record job below
  # still runs and still commits. No azure/login: duckrun mints the OneLake and Fabric tokens
  # from the OIDC assertion, as in `land`. The curl transport is for DuckDB reading parquet
  # off Fabric, as in build.yml.
  layout:
    name: layout read back
    # `compact` too, and explicitly: it rewrites exactly the files this job measures. When the
    # run built no iceberg leg that job is SKIPPED, and `if: !cancelled()` below is what keeps
    # this one running anyway -- a skipped `needs` otherwise skips the jobs behind it.
    needs: [plan, build, compact]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Footers over OneLake for five engines' worth of tables; the source repo's four items
    # took ~10 minutes, and a too-short cap turns slowness into a red run.
    timeout-minutes: 60
    continue-on-error: true
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      DBT_SCHEMA: ${{ inputs.dbt_schema }}
      # Recorded under layout.config, not used here: what build.yml ran the notebook legs at.
      FABRIC_CORES: ${{ inputs.fabric_cores }}
      SPARK_RESOURCE_PROFILE: ${{ inputs.spark_resource_profile }}
      # Only the engines this run built: reading an engine nobody rebuilt would record an
      # older generation's layout under this run's id.
      BUILD_ENGINES: ${{ join(fromJSON(needs.plan.outputs.engines).*.engine, ',') }}
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/duckrun.txt
      - run: pip install -r requirements/duckrun.txt
      - name: Read the layout back
        run: |
          echo "RUN_RECORD=$RUNNER_TEMP/record/record-30-layout.json" >> "$GITHUB_ENV"
          RUN_RECORD="$RUNNER_TEMP/record/record-30-layout.json" python .github/scripts/layout.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: record-fragment-layout
          path: ${{ runner.temp }}/record/
          if-no-files-found: ignore

  # THE ACCEPTANCE TEST, AND THE RUN'S PAPER TRAIL. Everything above is just a build; this
  # compares the engines' fingerprints (the claim the repo makes) and assembles ONE run record
  # from every job's fragment -- items by GUID, each leg's compute window, the layout, this
  # run's fingerprints -- and commits it to history/runs/. The Capacity units workflow then
  # reads CU for those items in those windows. Runs whatever happened above (!cancelled()):
  # a failed leg still spent capacity, and that still has to be attributable.
  record:
    name: parity + record
    needs: [build, layout]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: parity-*
          path: ${{ runner.temp }}/parity
          merge-multiple: true
      # merge-multiple: false (the default) nests each artifact in its own directory, which is
      # exactly why record.py sorts fragments by BASENAME.
      - uses: actions/download-artifact@v7
        with:
          pattern: record-fragment-*
          path: ${{ runner.temp }}/fragments
      - name: Compare engines
        id: parity
        if: inputs.engines == 'all'
        # continue-on-error so the record below is assembled and committed either way; the
        # verdict step at the end turns a failed comparison back into a red job.
        continue-on-error: true
        # THIS RUN'S DOWNLOADED FINGERPRINTS, never history/parity/: after the first commit that
        # directory also holds the previous run's, so a leg that failed this run would be graded
        # on a stale fingerprint. pipefail, or `| tee` reports tee's exit status and a PARITY
        # FAILED run goes green (run 35111311688 did exactly that).
        run: |
          set -o pipefail
          python .github/scripts/parity.py compare "$RUNNER_TEMP/parity" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Assemble the run record
        id: rec
        run: |
          set -euo pipefail
          out="history/runs/$(date -u +%Y-%m-%dT%H%MZ)-${{ github.run_id }}.json"
          mkdir -p history/runs
          python .github/scripts/record.py finish "$RUNNER_TEMP/fragments" "$RUNNER_TEMP/parity" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: run-record
          path: ${{ steps.rec.outputs.path }}
      # NO REBASE. Reset onto whatever origin holds RIGHT NOW, put the record (and, when the
      # comparison passed, the fingerprints) back, commit, push -- and repeat against a newer
      # origin if the push loses. The Capacity units workflow commits history/cu.json on its own
      # concurrency group, so the two can race on the ref and never on a file. The files are
      # copied aside first because `reset --hard` on attempt 2 deletes exactly what attempt 1
      # committed.
      #
      # -f IS REQUIRED for the fingerprints. .gitignore carries `history/parity/*.json` so that a
      # laptop run cannot commit a fingerprint and poison the comparison, and `git add <dir>`
      # SKIPS ignored files silently -- the run then goes green having recorded NOTHING, which
      # is why history/parity/ held no fingerprints at all for a while. CI is the one writer
      # allowed to override the ignore. tests_py/test_parity_record.py pins this.
      - name: Commit
        env:
          REC: ${{ steps.rec.outputs.path }}
          BR: ${{ github.ref_name }}
          PARITY_OK: ${{ steps.parity.outcome == 'success' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$REC" "$RUNNER_TEMP/record.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BR"
            git reset -q --hard "origin/$BR"
            mkdir -p history/runs history/parity
            cp "$RUNNER_TEMP/record.json" "$REC"
            git add "$REC"
            if [ "$PARITY_OK" = "true" ]; then
              cp "$RUNNER_TEMP"/parity/*.json history/parity/
              git add -f history/parity
            fi
            if git diff --cached --quiet; then echo "nothing to commit" >&2; exit 0; fi
            git commit -q -m "record: run ${{ github.run_id }} (${{ inputs.engines }})"
            if git push -q origin "HEAD:$BR"; then echo "pushed on attempt $attempt" >&2; exit 0; fi
            echo "push lost a race on attempt $attempt -- refetching origin/$BR" >&2
            sleep $((attempt * 5))
          done
          echo "could not push after 5 attempts; the record is still the run-record artifact" >&2
          exit 1
      - name: Parity verdict
        if: steps.parity.outcome == 'failure'
        run: |
          echo "PARITY FAILED -- see the Compare engines step. The run record was committed; the fingerprints were not." >&2
          exit 1

  # THE IN-FABRIC DEMO, deployed AFTER the build so the Direct Lake models find their tables
  # (a model reframes on deploy). Off by default: orchestration is GitHub Actions; the notebook
  # and pipeline are a demo of in-Fabric scheduling, and redeploying them every run is churn.
  # No azure/login: duckrun mints the storage, Fabric and Power BI tokens from the OIDC
  # assertion, exactly as on the duckrun leg.
  deploy:
    name: deploy demo (optional)
    needs: [plan, build]
    if: ${{ inputs.deploy != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      DBT_SCHEMA: ${{ inputs.dbt_schema }}
      # The engines this run built: one semantic model each, aemo_<engine>.
      DEPLOY_ENGINES: ${{ join(fromJSON(needs.plan.outputs.engines).*.engine, ',') }}
      DEPLOY_SEMANTIC_MODEL: ${{ inputs.deploy == 'full' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/duckrun.txt
      # duckrun is the whole backend; provision.py's `requests` comes with it.
      - run: pip install -r requirements/duckrun.txt
      - name: Deploy (${{ inputs.deploy }})
        run: python deploy.py
