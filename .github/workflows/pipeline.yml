name: pipeline

# Display only. The run page's title, instead of "pipeline #NN" -- what this run actually is,
# legible in a screenshot without reading the inputs.
run-name: pipeline — ${{ inputs.engines == 'all' && 'both engines' || inputs.engines }}, one gold layer

# Builds the same models on every engine, proves they agree, and writes down what the run
# touched and what it wrote (history/runs/); the Capacity units workflow then adds what it cost.
#
# Manual only. Provisioning Fabric items and spending capacity is a deliberate act, and the
# record job commits to history/ (the run record and the parity fingerprints), so a push
# trigger would make the commit start the next run. A push made with GITHUB_TOKEN triggers
# nothing, which is what makes committing from here safe today; NEVER add a push: trigger
# here or to capacity.yml -- tests_py/test_parity_record.py pins the trigger set.

on:
  workflow_dispatch:
    inputs:
      engines:
        description: Which engines to build
        type: choice
        default: all
        options: [all, dwh, spark]
      dbt_schema:
        description: DBT_SCHEMA — leave as 'mart' for production (schemas are <engine>_landing / <engine>_mart), or set e.g. 'test' to land the whole run in test_<engine>_landing / test_<engine>_mart instead
        type: string
        default: mart
      download_limit:
        description: Intraday files per feed per run (nemweb throttles bursts)
        type: string
        default: "6"
      daily_download_limit:
        description: Daily archive files per run (backfilled from GitHub, so a higher limit is safe)
        type: string
        default: "60"
      spark_resource_profile:
        description: readHeavyForPBI (V-Order on, Power BI-facing layout) or writeHeavy (the Fabric workspace default)
        type: choice
        default: readHeavyForPBI
        options: [readHeavyForPBI, writeHeavy]
      process_limit:
        description: Files each fact model folds per run, NEWEST first (every engine honours it; a backlog converges over runs and shows as test WARNINGS, not failures). The throttle for spark's first build.
        type: string
        default: "1000"

permissions:
  id-token: write
  contents: write

concurrency:
  # Never two of these against one workspace. NOT cancel-in-progress: cancelling a GitHub
  # job does not stop Fabric — a Warehouse query or Livy session keeps running, and billing.
  group: pipeline-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Free gate. Nothing spends capacity until the gating is proven correct, because a
  # broken gate builds nothing and still reports success.
  checks:
    uses: ./.github/workflows/ci.yml

  plan:
    name: plan engines
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.pick.outputs.engines }}
    steps:
      - id: pick
        # A GitHub matrix cannot be filtered by an input, so the list is computed here.
        #
        # Each entry is {engine, label}. `engine` is the real target name and is what every
        # file in the repo keys on — do NOT rename those. `label` is cosmetic: it is the only
        # thing the Actions UI shows. The same labels are in ci.yml's gating matrix and in
        # layout.py's LABEL, and the three are meant to match. 🏢/⚡ rather than 🏛/🗲: those
        # two have no default emoji presentation and can come out as monochrome text glyphs.
        run: |
          ALL='[{"engine":"dwh","label":"🏢 fabric · warehouse"},
                {"engine":"spark","label":"⚡ fabric · spark"}]'
          if [ "${{ inputs.engines }}" = "all" ]; then
            echo "engines=$(echo "$ALL" | jq -c .)" >> "$GITHUB_OUTPUT"
          else
            echo "engines=$(echo "$ALL" | jq -c --arg e '${{ inputs.engines }}' '[.[]|select(.engine==$e)]')" >> "$GITHUB_OUTPUT"
          fi

  # LAND ONCE, HERE, so the build legs can run at the same time.
  #
  # download_aemo.py rewrites csv_raw_archive_log.parquet in place; legs landing concurrently
  # would race on that single file and would also each re-fetch the same nemweb archives.
  #
  # It also removes a second race: this job provisions the folder, dbt_landing and the shared
  # dbt lakehouse up front, so the parallel legs all find them already there instead of
  # create-if-missing calls colliding on the same item name.
  land:
    name: land AEMO (once)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      download_limit: ${{ inputs.download_limit }}
      daily_download_limit: ${{ inputs.daily_download_limit }}
      # The dispatch inputs, as `record.py init` writes them into the run record. Blank = absent.
      RUNIN_ENGINES: ${{ inputs.engines }}
      RUNIN_DBT_SCHEMA: ${{ inputs.dbt_schema }}
      RUNIN_PROCESS_LIMIT: ${{ inputs.process_limit }}
      RUNIN_SPARK_RESOURCE_PROFILE: ${{ inputs.spark_resource_profile }}
      RUNIN_DOWNLOAD_LIMIT: ${{ inputs.download_limit }}
      RUNIN_DAILY_DOWNLOAD_LIMIT: ${{ inputs.daily_download_limit }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      # 5000 req/h authenticated against 60 anonymous, and runners share IPs.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      # DuckDB here is a library (download_aemo.py's listing and log), not a dbt adapter;
      # OneLake I/O is azure-identity + azure-storage-file-datalake (onelake.py).
      - run: pip install -r requirements/ops.txt
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # The run record starts here -- run id, sha, inputs -- and provision.py adds the shared
      # items' GUIDs to the same fragment. record.py; the record job merges every job's.
      # A step, not job env: the `runner` context is not available at job level.
      - name: Open the run record
        run: |
          echo "RUN_RECORD=$RUNNER_TEMP/record/record-00-run.json" >> "$GITHUB_ENV"
          RUN_RECORD="$RUNNER_TEMP/record/record-00-run.json" python .github/scripts/record.py init
      - name: Provision the shared items
        run: python .github/scripts/provision.py landing >> "$GITHUB_ENV"
      - name: Land AEMO files
        run: python download_aemo.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: record-fragment-00-run
          path: ${{ runner.temp }}/record/
          if-no-files-found: ignore

  # ONE LEG PER ENGINE: build it, test it, fingerprint its gold table. Landing already happened
  # ONCE, above, which is the only reason these can run at the same time.
  #
  # dbt runs on the runner for both engines, and it is only a CLIENT there: the compute is the
  # Warehouse (dwh) or a Livy session (spark).
  #
  # Deliberately NO `--select` anywhere: model selection is entirely +enabled in
  # dbt_project.yml, keyed on the target name.
  build:
    needs: [plan, land]
    # Cosmetic only — `matrix.engine` below is still the real target name.
    name: build (${{ matrix.label }})
    strategy:
      # Both at once. They write separate schemas, and the landing zone is already written by
      # the `land` job above, so nothing is contended.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.engines) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The workflow-level block is `contents: write` for the record job's commit; a build leg
    # has no business with it.
    permissions:
      id-token: write
      contents: read
    env:
      ENGINE: ${{ matrix.engine }}
      DBT_SCHEMA: ${{ inputs.dbt_schema }}
      process_limit: ${{ inputs.process_limit }}
      SPARK_RESOURCE_PROFILE: ${{ inputs.spark_resource_profile }}
      # dbt-fabricspark 1.13.0 runs OPTIMIZE after every Delta build, which rewrites the
      # layout the run just produced.
      DBT_FABRICSPARK_SKIP_OPTIMIZE: "true"
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          # Default glob is **/requirements.txt, which this repo has not got.
          cache-dependency-path: requirements/*.txt

      - name: Install ${{ matrix.engine }} dependencies
        # ONE list per engine, and the same one the gating job installs.
        run: pip install -r "requirements/${ENGINE}.txt"

      # ---- auth -------------------------------------------------------------------
      # provision.py and the adapters' CLI auth both use this session; the dwh leg also
      # captures its Warehouse token below.
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # ---- the run record -------------------------------------------------------------
      # The fragment this leg writes (record.py): the items it touched, under their GUIDs, and
      # the leg's compute window. OUTSIDE the checkout, so no untracked file lands in the tree;
      # the record job below merges every job's fragment into history/runs/. A step, not job
      # env: the `runner` context is not available at job level.
      - name: Open the run-record fragment
        run: echo "RUN_RECORD=$RUNNER_TEMP/record/record-20-build-$ENGINE.json" >> "$GITHUB_ENV"

      # ---- provision ---------------------------------------------------------------
      - name: Provision Fabric items
        run: python .github/scripts/provision.py "$ENGINE" >> "$GITHUB_ENV"

      - name: Capture Warehouse SQL token
        if: matrix.engine == 'dwh'
        # Captured HERE, not lazily at dbt-run time: the OIDC client assertion lasts only
        # ~5 minutes, and provisioning above can outlive it. Without this the run dies at the
        # first model with AADSTS700024.
        run: |
          TOKEN=$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "FABRIC_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # NO LANDING STEP HERE, on purpose. download_aemo.py rewrites
      # csv_raw_archive_log.parquet in place, so legs landing at once would race on that one
      # file. The shared `land` job above is the one writer, and one landing zone for both
      # engines is also what makes the parity comparison below mean anything.

      # ---- the leg's window --------------------------------------------------------
      # `started` / `finished` bracket everything that spends Fabric compute -- build, tests
      # AND the fingerprint -- and are what measure_cu.py attributes this leg's capacity units
      # with, at the metrics model's hour grain. The items are persistent and shared here, so
      # the window is not optional: without it a GUID's CU is every run's CU. history/README.md.
      - name: Record leg start
        run: python .github/scripts/record.py leg-start "$ENGINE"

      # ---- build -------------------------------------------------------------------
      - name: dbt build
        working-directory: dbt1
        # `dbt retry` needs --target too, or it renders the profile's default target.
        run: |
          dbt build --target "$ENGINE" --profiles-dir . \
            || dbt retry --target "$ENGINE" --profiles-dir .

      # ---- fingerprint -------------------------------------------------------------
      - name: Fingerprint gold layer
        working-directory: dbt1
        # parity.py is addressed through $GITHUB_WORKSPACE: this step's cwd is the project, not
        # the repo root, and the artifact path below is repo-relative.
        run: |
          dbt run-operation parity_fingerprint --target "$ENGINE" --profiles-dir . \
            | python "$GITHUB_WORKSPACE/.github/scripts/parity.py" capture "$GITHUB_WORKSPACE/history/parity"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: parity-${{ matrix.engine }}
          path: history/parity/${{ matrix.engine }}.json
          if-no-files-found: warn

      # AFTER the fingerprint, not after the build: on spark the run-operation opens a new
      # Livy session and on dwh it is a full Warehouse Query, both billed. `job.status` is
      # already `failure` once any earlier step failed, so no step ids are needed.
      - name: Record leg end
        if: always()
        run: python .github/scripts/record.py leg-end "$ENGINE" "${{ job.status }}"

      # always(): a failed build still spent compute, and it still has to be attributable.
      # `ignore`: RUN_RECORD unset (or a leg that died before leg-start) is a no-op fragment,
      # not an error -- record.py logs what it assembled.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: record-fragment-build-${{ matrix.engine }}
          path: ${{ runner.temp }}/record/
          if-no-files-found: ignore

  # WHAT EACH ENGINE WROTE. layout.py reads each engine's tables back through their Delta logs
  # -- rows, files, row groups, size, compression -- plus fct_summary's per-column encodings,
  # row-group ordering and run lengths, and puts the engines side by side in the step summary
  # and in the run record under `layout`. It only READS.
  #
  # Best-effort by construction (continue-on-error here, try/except per engine inside): a
  # table that cannot be read is "not measured", never a red run, and the record job below
  # still runs and still commits. The curl transport is for DuckDB reading parquet footers off
  # OneLake from a runner.
  layout:
    name: layout read back
    needs: [plan, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Footers over OneLake; a too-short cap turns slowness into a red run.
    timeout-minutes: 60
    continue-on-error: true
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      DBT_SCHEMA: ${{ inputs.dbt_schema }}
      SPARK_RESOURCE_PROFILE: ${{ inputs.spark_resource_profile }}
      # Only the engines this run built: reading an engine nobody rebuilt would record an
      # older generation's layout under this run's id.
      BUILD_ENGINES: ${{ join(fromJSON(needs.plan.outputs.engines).*.engine, ',') }}
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ops.txt
      - run: pip install -r requirements/ops.txt
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Read the layout back
        run: |
          echo "RUN_RECORD=$RUNNER_TEMP/record/record-30-layout.json" >> "$GITHUB_ENV"
          RUN_RECORD="$RUNNER_TEMP/record/record-30-layout.json" python .github/scripts/layout.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: record-fragment-layout
          path: ${{ runner.temp }}/record/
          if-no-files-found: ignore

  # THE ACCEPTANCE TEST, AND THE RUN'S PAPER TRAIL. Everything above is just a build; this
  # compares the engines' fingerprints (the claim the repo makes) and assembles ONE run record
  # from every job's fragment -- items by GUID, each leg's compute window, the layout, this
  # run's fingerprints -- and commits it to history/runs/. The Capacity units workflow then
  # reads CU for those items in those windows. Runs whatever happened above (!cancelled()):
  # a failed leg still spent capacity, and that still has to be attributable.
  record:
    name: parity + record
    needs: [build, layout]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: parity-*
          path: ${{ runner.temp }}/parity
          merge-multiple: true
      # merge-multiple: false (the default) nests each artifact in its own directory, which is
      # exactly why record.py sorts fragments by BASENAME.
      - uses: actions/download-artifact@v7
        with:
          pattern: record-fragment-*
          path: ${{ runner.temp }}/fragments
      - name: Compare engines
        id: parity
        if: inputs.engines == 'all'
        # continue-on-error so the record below is assembled and committed either way; the
        # verdict step at the end turns a failed comparison back into a red job.
        continue-on-error: true
        # THIS RUN'S DOWNLOADED FINGERPRINTS, never history/parity/: after the first commit that
        # directory also holds the previous run's, so a leg that failed this run would be graded
        # on a stale fingerprint. pipefail, or `| tee` reports tee's exit status and a PARITY
        # FAILED run goes green (run 35111311688 did exactly that).
        run: |
          set -o pipefail
          python .github/scripts/parity.py compare "$RUNNER_TEMP/parity" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Assemble the run record
        id: rec
        run: |
          set -euo pipefail
          out="history/runs/$(date -u +%Y-%m-%dT%H%MZ)-${{ github.run_id }}.json"
          mkdir -p history/runs
          python .github/scripts/record.py finish "$RUNNER_TEMP/fragments" "$RUNNER_TEMP/parity" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: run-record
          path: ${{ steps.rec.outputs.path }}
      # NO REBASE. Reset onto whatever origin holds RIGHT NOW, put the record (and, when the
      # comparison passed, the fingerprints) back, commit, push -- and repeat against a newer
      # origin if the push loses. The Capacity units workflow commits history/cu.json on its own
      # concurrency group, so the two can race on the ref and never on a file. The files are
      # copied aside first because `reset --hard` on attempt 2 deletes exactly what attempt 1
      # committed.
      #
      # -f IS REQUIRED for the fingerprints. .gitignore carries `history/parity/*.json` so that a
      # laptop run cannot commit a fingerprint and poison the comparison, and `git add <dir>`
      # SKIPS ignored files silently -- the run then goes green having recorded NOTHING, which
      # is why history/parity/ held no fingerprints at all for a while. CI is the one writer
      # allowed to override the ignore. tests_py/test_parity_record.py pins this.
      - name: Commit
        env:
          REC: ${{ steps.rec.outputs.path }}
          BR: ${{ github.ref_name }}
          PARITY_OK: ${{ steps.parity.outcome == 'success' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$REC" "$RUNNER_TEMP/record.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$BR"
            git reset -q --hard "origin/$BR"
            mkdir -p history/runs history/parity
            cp "$RUNNER_TEMP/record.json" "$REC"
            git add "$REC"
            if [ "$PARITY_OK" = "true" ]; then
              cp "$RUNNER_TEMP"/parity/*.json history/parity/
              git add -f history/parity
            fi
            if git diff --cached --quiet; then echo "nothing to commit" >&2; exit 0; fi
            git commit -q -m "record: run ${{ github.run_id }} (${{ inputs.engines }})"
            if git push -q origin "HEAD:$BR"; then echo "pushed on attempt $attempt" >&2; exit 0; fi
            echo "push lost a race on attempt $attempt -- refetching origin/$BR" >&2
            sleep $((attempt * 5))
          done
          echo "could not push after 5 attempts; the record is still the run-record artifact" >&2
          exit 1
      - name: Parity verdict
        if: steps.parity.outcome == 'failure'
        run: |
          echo "PARITY FAILED -- see the Compare engines step. The run record was committed; the fingerprints were not." >&2
          exit 1
