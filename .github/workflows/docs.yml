name: docs

# THE DAG, PUBLISHED. Runs `dbt docs generate --static` and deploys the one self-contained page
# it produces to GitHub Pages -- https://djouallah.github.io/fabric-medallion-dbt/.
# It builds nothing, commits nothing, spends no Fabric compute and needs NO CREDENTIALS.
#
#   pipeline         builds, records the run, commits history/runs/ + history/parity/   dispatch
#   docs             this -- generates the DAG, deploys to Pages              after pipeline · dispatch
#
# **WHY dwh, AND WHY NO CATALOG.** The models are identical on both engines, so either draws
# the same DAG. The catalog half is left empty (`--empty-catalog`, `--no-compile`): generating
# it would open a real connection, and on dwh a compile fires real OPENROWSET queries --
# macros/new_source_files.sql guards its parse-time `run_query` only on `not execute`,
# the exact trap AGENTS.md warns about. What is published is the lineage and every model,
# column and test description; row counts and sizes live in the run record's `layout` instead.
# So the profile gets dummy values, as in check_gating.py -- nothing is ever contacted.
#
# **THE PAGE IS ONE FILE.** `--static` inlines the manifest and the catalog into
# `target/static_index.html`. The alternative -- uploading `target/` wholesale -- also
# publishes run_results.json and every compiled .sql, and can half-load. One file cannot.
#
# **NEVER ADD A `push:` TRIGGER.** tests_py/test_parity_record.py::test_only_ci_runs_on_push
# pins the trigger set for every workflow but ci.yml; `workflow_run` already republishes
# whenever the pipeline runs.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [pipeline]
    types: [completed]
    # NO conclusion filter: the page documents the models in the repo, and they are the same
    # whether or not a leg's build succeeded.

# Pages serialises deploys on its own side; queue behind an in-flight publish rather than
# racing it, and never cancel one -- a half-replaced page is the one outcome worth avoiding.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # NOT `continue-on-error`: unattended, a failed generate would report green and the site
  # would quietly go stale at whatever it last published.
  site:
    name: generate the docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read      # reads the repo; writes nothing back
    env:
      # Enough to satisfy the dwh profile's env_var() calls; none of it is contacted.
      FILES_PATH: /tmp/landing
      FABRIC_DWH_SERVER: dummy.datawarehouse.fabric.microsoft.com
      FABRIC_DWH_NAME: dummy
      FABRIC_WORKSPACE_ID: "00000000-0000-0000-0000-000000000000"
      DBT_SCHEMA: mart
      PYTHONIOENCODING: utf-8
    steps:
      # `ref:` IS LOAD-BEARING. On a `workflow_run` event a default checkout takes the TRIGGERING run's head SHA -- from before the record
      # job pushed -- and `github.ref_name` is the default branch regardless of where the
      # pipeline ran, so a topic-branch pipeline would document main's models instead of its own.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dwh.txt
      - run: pip install -r requirements/dwh.txt

      # The gate first: a target name that stops matching models/aemo/<engine>/ enables
      # nothing, and dbt then writes a perfectly valid page with an EMPTY DAG and exits 0.
      - name: Gating
        run: python .github/scripts/check_gating.py dwh

      # `--no-compile` reads target/manifest.json, so parse writes it first.
      - name: dbt docs generate
        run: |
          dbt parse --target dwh --profiles-dir .
          dbt docs generate --static --no-compile --empty-catalog --target dwh --profiles-dir .

      # `--static` writes target/static_index.html -- manifest and catalog inlined, no sidecar
      # JSON, no CDN. That single file IS the site; nothing else from target/ is published.
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site
          cp target/static_index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Its own job because deploy-pages needs the `github-pages` environment, and `needs: site`
  # means a generate that failed cannot overwrite a good page with a half-written one.
  publish:
    name: publish to Pages
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
