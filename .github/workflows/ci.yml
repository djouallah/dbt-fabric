name: CI

# Free, credential-less, and the gate everything else depends on. It runs each engine
# through `dbt parse` and asserts what is enabled — because the default failure mode of
# this repo's layout is a run that builds NOTHING and exits 0. Costs no Fabric capacity,
# so it runs on every push.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          # Default glob is **/requirements.txt, which this repo has not got.
          cache-dependency-path: requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - name: Unit tests
        # Pins the shared column spec, the iceberg adapter overrides against the INSTALLED
        # dbt-duckdb, and every singular test against its own SQL dialect.
        run: python -m pytest tests_py/ -q

  # ONE JOB PER ENGINE, each installing only that engine's requirements.
  #
  # Not one job installing all five, for two independent reasons:
  #
  #   * dbt-fabric and dbt-fabricspark shadow each other under the dbt.adapters namespace,
  #     so loading the spark plugin fails with "has no attribute 'Plugin'"; the
  #     dbt-fabric-samdebruyn fork this replaced instead made the spark profile fail
  #     validation with "'database' is a required property". Both were found here rather
  #     than locally.
  #   * iceberg is dbt OSS 2 and the other four are dbt-core 1.x. They install a `dbt`
  #     console script each; in one environment the last one wins and the other four (or
  #     the one) get parsed by the wrong engine entirely.
  #
  # Splitting the matrix is also more faithful — each engine is validated against exactly
  # the dependencies it builds with. check_gating.py knows which project each engine is in.
  gating:
    # `label` is cosmetic — the only thing the Actions UI shows. `engine` is the real target
    # name that dbt, the folder layout and every script key on; do not rename those. The same
    # five labels are in pipeline.yml's `plan` step and in layout.py's LABEL, and the three are
    # meant to match.
    name: gating (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {engine: duckrun,  label: "🦆 duckdb · delta-rs"}
          - {engine: iceberg,  label: "🧊 dbt OSS 2 · iceberg"}
          - {engine: ducklake, label: "🌊 duckdb · ducklake"}
          - {engine: dwh,      label: "🏢 fabric · warehouse"}
          - {engine: spark,    label: "⚡ fabric · spark"}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # 3.12: dbt-fabric requires it.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/${{ matrix.engine }}.txt
      - run: pip install -r requirements/${{ matrix.engine }}.txt
      - name: Gating (${{ matrix.label }})
        # The one check that catches "green run, built nothing".
        run: python .github/scripts/check_gating.py ${{ matrix.engine }}
