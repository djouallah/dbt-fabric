name: build (one engine)

# The reusable leg: build one engine, test it, fingerprint its gold table. pipeline.yml calls
# this once per engine after landing ONCE in its shared `land` job. Everything engine-specific
# is an input, so there is exactly one copy of the skeleton the four source repos each had
# their own version of.
#
# WHERE dbt RUNS depends on the engine:
#
#   duckrun, ducklake, iceberg   ON FABRIC COMPUTE (FABRIC_CORES vCores), through duckrun's
#                                run_python -- .github/scripts/remote_dbt.py. DuckDB folds the
#                                AEMO archive in memory, and the 7 GB hosted runner was shut
#                                down mid-fct_scada twice in one day ("The runner has received
#                                a shutdown signal"). The original delta repo never ran dbt on
#                                the runner either (RemoteRunner: "the runner pulls every byte
#                                across the internet twice"). Here the runner only provisions,
#                                launches and collects the log. Cancelling the GitHub job does
#                                NOT stop the notebook -- it runs, and bills, to completion.
#   dwh, spark                   on the runner. dbt is only a client there; the compute is the
#                                Warehouse / the Livy session.
#
# Deliberately NO `--select` anywhere: model selection is entirely +enabled in
# dbt_project.yml, keyed on the target name.

on:
  workflow_call:
    inputs:
      engine:
        description: duckrun | iceberg | ducklake | dwh | spark
        required: true
        type: string
      dbt_schema:
        description: DBT_SCHEMA — 'mart' gives <engine>_landing / <engine>_mart; anything else prefixes further, into <value>_<engine>_landing / <value>_<engine>_mart
        required: false
        default: mart
        type: string
      download_limit:
        required: false
        default: "6"
        type: string
      daily_download_limit:
        required: false
        default: "60"
        type: string
      process_limit:
        description: Files each fact model folds per run, oldest first. Every engine honours it; a backlog converges over runs.
        required: false
        default: "1000"
        type: string
      land:
        description: Run download_aemo.py in this leg. pipeline.yml sets false — it lands ONCE in a shared job so the legs can run in parallel.
        required: false
        default: true
        type: boolean
      spark_resource_profile:
        required: false
        # readHeavyForPBI, not the workspace default: fct_summary is read by Power BI
        # through Direct Lake, and this is the only profile that turns V-Order on.
        default: readHeavyForPBI
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ENGINE: ${{ inputs.engine }}
      # The three legs whose dbt runs inside Fabric. Exact match on the list, not a substring.
      REMOTE: ${{ contains(fromJSON('["duckrun", "ducklake", "iceberg"]'), inputs.engine) }}
      FABRIC_CORES: "8"
      DBT_SCHEMA: ${{ inputs.dbt_schema }}
      download_limit: ${{ inputs.download_limit }}
      daily_download_limit: ${{ inputs.daily_download_limit }}
      process_limit: ${{ inputs.process_limit }}
      SPARK_RESOURCE_PROFILE: ${{ inputs.spark_resource_profile }}
      # For anything DuckDB that still runs ON THE RUNNER (a local build of a DuckDB target):
      # off a Fabric notebook the azure extension needs the curl transport and the system CA
      # bundle. remote_dbt.py deliberately does not forward these into Fabric.
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      DUCKDB_TEMP_DIR: /tmp/duckdb_spill
      # dbt-fabricspark 1.13.0 runs OPTIMIZE after every Delta build, which rewrites the
      # layout the run just produced.
      DBT_FABRICSPARK_SKIP_OPTIMIZE: "true"
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
      # An authenticated GitHub API call gets 5000 req/h against 60 anonymous, and runners
      # share IPs — without this the archive backfill listing hits the anonymous quota.
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Default glob is **/requirements.txt, which this repo has not got.
          cache-dependency-path: requirements/*.txt

      - name: Install ${{ inputs.engine }} dependencies
        run: pip install -r requirements/${{ inputs.engine }}.txt

      # ---- auth -------------------------------------------------------------------
      # duckrun — and ONLY duckrun — mints every token it needs (OneLake storage, Fabric
      # control plane) by exchanging a fresh GitHub OIDC assertion, so its leg needs no login
      # step. Every other engine gets an Azure session: provision.py falls back to `az` for
      # any audience duckrun cannot mint, and the dwh leg captures its Warehouse token below.
      - name: Azure login
        if: inputs.engine != 'duckrun'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # ---- provision ---------------------------------------------------------------
      - name: Provision Fabric items
        run: python .github/scripts/provision.py "$ENGINE" >> "$GITHUB_ENV"

      - name: Capture Warehouse SQL token
        if: inputs.engine == 'dwh'
        # Captured HERE, not lazily at dbt-run time: the OIDC client assertion lasts only
        # ~5 minutes, and the landing step below can outlive it. Without this the run dies
        # at the first model with AADSTS700024.
        run: |
          TOKEN=$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "FABRIC_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # ---- land --------------------------------------------------------------------
      - name: Land AEMO files
        # One downloader for every engine, one landing zone, plain CSV. If the engines read
        # different bytes the parity comparison below means nothing.
        #
        # SKIPPED when pipeline.yml already landed in its shared `land` job. It has to be:
        # download_aemo.py rewrites csv_raw_archive_log.parquet with a delete-then-copy, so
        # five legs landing at once would race on that one file — which is the only reason
        # the legs used to be forced through max-parallel: 1.
        if: ${{ inputs.land }}
        run: python download_aemo.py

      # ---- build -------------------------------------------------------------------
      - name: dbt build on Fabric compute
        if: env.REMOTE == 'true'
        # build || retry, then the fingerprint, all inside one Fabric Python notebook; the
        # fingerprint is lifted out of the streamed log into history/parity/<engine>.json.
        run: python .github/scripts/remote_dbt.py "$ENGINE"

      - name: dbt build
        if: env.REMOTE != 'true'
        # `dbt retry` needs --target too, or it renders the profile's default target.
        #
        # dwh: the RUNNER decides whether fct_summary is rebuilt, exactly as the original dwh
        # repo's CI did. check_new_daily raises when daily files are landing that fct_scada has
        # not ingested yet, and the build then carries `rebuild_summary: true`, which flips the
        # model to delete+insert over the full history — never --full-refresh, which DROPs and
        # recreates and deadlocks Fabric's background maintenance. Without this probe the
        # summary only ever appended intraday while the daily backfill kept adding days.
        run: |
          VARS=()
          if [ "$ENGINE" = "dwh" ]; then
            if dbt run-operation check_new_daily --target "$ENGINE" --profiles-dir .; then
              echo "no new daily files pending: fct_summary appends intraday"
            else
              echo "new daily files pending: fct_summary rebuilds (delete+insert)"
              VARS=(--vars "{rebuild_summary: true}")
            fi
          fi
          dbt build --target "$ENGINE" --profiles-dir . "${VARS[@]}" \
            || dbt retry --target "$ENGINE" --profiles-dir .

      - name: dbt docs
        if: always() && env.REMOTE != 'true'
        run: dbt docs generate --target "$ENGINE" --profiles-dir . || true

      # ---- fingerprint -------------------------------------------------------------
      - name: Fingerprint gold layer
        if: env.REMOTE != 'true'
        run: |
          mkdir -p history/parity
          dbt run-operation parity_fingerprint --target "$ENGINE" --profiles-dir . \
            | python .github/scripts/parity.py capture history/parity

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-${{ inputs.engine }}
          path: history/parity/${{ inputs.engine }}.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python .github/scripts/summary.py >> "$GITHUB_STEP_SUMMARY" || true

  # Iceberg accumulates small files and has no snapshot expiry, so compaction is a separate
  # job. `needs` is for ORDERING only — never overlap a rewrite with a load — and it must
  # NOT gate on the build succeeding: fragmentation is just as real after a failed build.
  compact:
    if: ${{ inputs.engine == 'iceberg' && !cancelled() }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      COMPACT_BUDGET_MINUTES: "70"
      COMPACT_MIN_INPUT_FILES: "5"
      PYTHONUNBUFFERED: "1"
      # Separate job, so $GITHUB_ENV from the build does not reach it. Without this the
      # script would resolve iceberg_landing/iceberg_mart while the run built into
      # test_iceberg_landing/test_iceberg_mart, and report a tidy catalog having compacted
      # nothing.
      DBT_SCHEMA: ${{ inputs.dbt_schema }}
      AZURE_TRANSPORT_OPTION_TYPE: curl
      CURL_CA_INFO: /etc/ssl/certs/ca-certificates.crt
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Default glob is **/requirements.txt, which this repo has not got.
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/iceberg.txt
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        # $GITHUB_ENV does not cross jobs, so this job mints its own token and re-resolves
        # the warehouse path. This one runs on the runner: it is a metadata rewrite, not a fold.
        run: |
          TOKEN=$(az account get-access-token --resource https://storage.azure.com/ --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "ONELAKE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - run: python .github/scripts/provision.py iceberg >> "$GITHUB_ENV"
      - run: python .github/scripts/compact_iceberg.py
