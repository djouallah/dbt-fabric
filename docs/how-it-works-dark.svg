<text x='704' y='106' font-size='18' text-anchor='start' class='acc'>gold</text>
<text x='758' y='106' font-size='12' text-anchor='start' class='soft' font-style='italic'>curated - &lt;engine&gt;_mart</text>
<text x='704' y='144' font-size='15' text-anchor='start' class='ink'>fct_summary</text>
<text x='704' y='166' font-size='11' text-anchor='start' class='soft'>one row per (date, time, DUID):</text>
<text x='704' y='184' font-size='11' text-anchor='start' class='soft'>generation joined to the price</text>
<text x='704' y='202' font-size='11' text-anchor='start' class='soft'>of its region, merged key by key</text>
<text x='704' y='236' font-size='13' text-anchor='start' class='ink'>dim_duid  ·  dim_calendar</text>
<text x='704' y='254' font-size='11' text-anchor='start' class='soft'>the star it is read through:</text>
<text x='704' y='272' font-size='11' text-anchor='start' class='soft'>unit, fuel, region  ·  every date</text>
<text x='704' y='300' font-size='11' text-anchor='start' class='soft'>Direct Lake reads all three</text>
<text x='704' y='316' font-size='11' text-anchor='start' class='soft'>in place - no copy, no import</text>
