<text x='58' y='106' font-size='18' text-anchor='start' class='bro'>bronze</text>
<text x='130' y='106' font-size='12' text-anchor='start' class='soft' font-style='italic'>raw - files, not tables</text>
<text x='58' y='142' font-size='14' text-anchor='start' class='ink'>download_aemo.py</text>
<text x='58' y='162' font-size='11' text-anchor='start' class='soft'>python - not a dbt model,</text>
<text x='58' y='180' font-size='11' text-anchor='start' class='soft'>no engine involved yet</text>
