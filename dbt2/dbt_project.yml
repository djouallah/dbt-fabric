name: 'aemo_electricity'
version: '1.0.0'
profile: 'aemo_electricity'

model-paths: ["models"]
# `../macros` is the SHARED macro set, the same directory ../dbt1 reads. The AEMO column
# layout (aemo_columns.sql) lives there and nowhere else, which is what stops the two
# projects' idea of the CSV drifting apart.
#
# The local `macros/` holds exactly one thing: the `insert_only` incremental strategy, which
# exists because dbt 2's config schema has no way to express "MERGE, but do not touch matched
# rows" — see that file. It is dbt2-only and must NOT move up to ../macros, where it would be
# a second, silently diverging definition of what the other four engines get from config.
#
# Do NOT add adapter overrides here. dbt v2 ships its own Iceberg-aware DuckDB macros
# (DESCRIBE for column discovery, DROP without CASCADE, a standalone rename, a direct-create
# path for Iceberg REST) — exactly what the old macros/iceberg_adapter_overrides.sql
# hand-patched into dbt-duckdb 1.x. Porting that file here would replace v2's better version
# of itself with a stale copy.
macro-paths: ["macros", "../macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

# =====================================================================================
# THIS PROJECT IS dbt OSS 2 AND ITS ONE ENGINE: iceberg.
#
# WHY IT IS A SEPARATE PROJECT AND NOT A FIFTH TREE IN ../dbt1. catalogs.yml is read from
# the directory holding dbt_project.yml, and dbt-core 1.x aborts the moment one exists:
# with use_catalogs_v2 set it raises "Adapter 'duckdb' does not support catalogs.yml v2
# yet" (dbt/cli/requires.py, _bridge_v2_catalogs), and with the flag off the v1 loader
# rejects the entry for having no `write_integrations`. One project root cannot hold both,
# so the engines are split by dbt MAJOR VERSION, not by anything about the data.
#
# WHAT IS DELIBERATELY IDENTICAL TO ../dbt1, because the whole repo exists to compare
# engines on equal terms:
#   * the model SQL     — models/aemo/iceberg/** is the same business logic as the other
#                         four trees; see the one-gold-layer rule in CLAUDE.md
#   * the patch files   — models/aemo/_*.yml is a byte-for-byte copy of ../dbt1's, pinned
#                         by tests_py/test_patch_files_match.py
#   * the schema names  — generate_schema_name() is shared and keys on target.name, so this
#                         engine still writes iceberg_landing / iceberg_mart, the same
#                         schemas the dbt-duckdb leg wrote before it. Nothing to migrate.
#   * the shared macros — ../macros
#
# THE TARGET NAME IS STILL THE ENGINE SELECTOR. There is only one tree here, but the
# +enabled gate below stays: without it, `dbt build --target <anything>` would build this
# tree under the wrong name and generate_schema_name() would put it in the wrong schema.
# check_gating.py checks this project too.
# =====================================================================================

flags:
  # The v2 catalogs.yml spec. Without this dbt reads catalogs.yml with the v1 loader and
  # rejects our entry for having no `write_integrations`. dbt 2.0 still logs
  # "catalogs.yml v2 schema validation is experimental ... its spec is liable to change"
  # (dbt1701) — expected, not an error; the demo run this was ported from ended
  # "1 warning" for exactly that reason.
  use_catalogs_v2: true

on-run-start:
  # Renders to whitespace when the variable is unset, which is the normal case: this leg
  # runs INSIDE a Fabric notebook, where DuckDB's default OneLake transport is the one that
  # works. The hook exists for a run on a bare runner, where the azure extension needs the
  # curl transport and the system CA bundle or every OneLake read dies "Problem with the
  # SSL CA cert (path? access rights?)". Same condition ../dbt1 uses.
  - "{% if env_var('AZURE_TRANSPORT_OPTION_TYPE', 'default') != 'default' %}SET GLOBAL azure_transport_option_type = '{{ env_var('AZURE_TRANSPORT_OPTION_TYPE') }}'{% endif %}"
  # Spill directory. Set through a hook and not through profiles.yml `settings:`, which dbt
  # v2 applies on a throwaway connection that the models never see — measured twice on the
  # demo this was ported from, including an attempt to smuggle in a GLOBAL by spelling the
  # key "GLOBAL azure_transport_option_type", which failed as an unrecognized parameter
  # because the key is normalised. run_in_fabric.py points DUCKDB_TEMP_DIR at the
  # notebook's ~135 GiB work disk; /tmp there is a ~19 GiB overlay.
  #
  # IF THIS TURNS OUT NOT TO REACH MODEL CONNECTIONS ON v2, the proven alternative is a
  # `+pre_hook` on the iceberg tree below — a pre_hook runs on the MODEL's own connection,
  # so a plain session-scoped SET suffices. dbt hooks are additive rather than scalar, so
  # adding one there does not clobber the SET VARIABLE pre_hook the fact models carry.
  - "{% if env_var('DUCKDB_TEMP_DIR', '') != '' %}SET GLOBAL temp_directory = '{{ env_var('DUCKDB_TEMP_DIR') }}'{% endif %}"

models:
  aemo_electricity:
    aemo:
      iceberg:
        +enabled: "{{ target.name == 'iceberg' }}"
        # THIS is what routes every model in the tree through catalogs.yml. Without it dbt
        # writes to the profile's plain DuckDB database instead of the OneLake catalog, and
        # an in-memory one at that — a green run that persisted nothing.
        +catalog_name: onelake
        dimensions: {+schema: mart}
        marts:      {+schema: landing}

data_tests:
  aemo_electricity:
    aemo:
      # Same asymmetry as ../dbt1 and for the same reason: a generic test declared in
      # models/aemo/_*.yml has fqn ['aemo_electricity', 'aemo', '<test_name>'] with NO
      # engine segment, so the `aemo` key must carry no target clause or every generic test
      # would be disabled. The singular tests under tests/aemo/iceberg/ do have the segment.
      iceberg: {+enabled: "{{ target.name == 'iceberg' }}"}
