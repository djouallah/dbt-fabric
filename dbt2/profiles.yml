# ONE profile, ONE output — this project has a single engine. Always invoked as
#   dbt build --target iceberg --profiles-dir .
# from this directory (or with --project-dir dbt2 --profiles-dir dbt2).
#
# THE TARGET NAME IS STILL LOAD-BEARING even with one output. dbt_project.yml gates the
# tree on `target.name == 'iceberg'`, and the shared generate_schema_name() keys on it to
# produce iceberg_landing / iceberg_mart. Rename this output and the run builds nothing,
# or builds into the wrong schemas. check_gating.py is what catches that offline.
#
# WHAT IS NOT HERE ANY MORE, versus the dbt-duckdb leg this replaces: the whole `attach:`
# block. dbt v2 emits the ATTACH from catalogs.yml. There is no `extensions:` list either —
# the azure / iceberg / avro extensions are pulled by the engine's own DuckDB driver.

aemo_electricity:
  target: iceberg
  outputs:

    # ---------------------------------------------------------------- iceberg -----------
    # dbt OSS 2's built-in DuckDB engine, writing through the OneLake Iceberg REST catalog.
    # No dbt-duckdb, no duckdb pip package, no adapter install of any kind.
    iceberg:
      type: duckdb
      path: ':memory:'
      # NO `database:` KEY, and that is deliberate -- the dbt-duckdb leg this replaces had
      # `database: onelake` to match its ATTACH alias. Two reasons it is gone:
      #   * the catalog owns it now. catalogs.yml's `name` becomes the attach alias (the
      #     `attach_as` option overrides it), and a model carrying +catalog_name resolves
      #     its relation through that integration.
      #   * a DuckDB profile on `path: ':memory:'` is validated against its database name.
      #     dbt-duckdb 1.x rejects the pair outright -- "Inconsistency detected between
      #     'path' and 'database' fields in profile; the 'database' property must be set to
      #     'memory' to match the 'path'" -- and naming it `onelake` here reintroduces
      #     exactly that argument with the engine for no gain.
      # The working demo profile this was ported from carried no `database` either.
      schema: "{{ env_var('DBT_SCHEMA', 'mart') }}"
      # int(4), not a bare int filter: Jinja's bare `int` yields 0 on a non-numeric value
      # and dbt accepts threads: 0.
      threads: "{{ env_var('DBT_THREADS', '4') | int(4) }}"
      settings:
        # A performance knob, not a correctness one — which matters here, because dbt v2
        # applies `settings:` on a THROWAWAY connection (dbt-auth's generate_duckdb_init_sql
        # emits a bare session-scoped SET, and apply_duckdb_init_sql runs it on a temporary
        # connection). If it does not reach the model connections the run is merely slower.
        # Anything that must reach a model goes in an on-run-start hook instead; see
        # dbt_project.yml.
        preserve_insertion_order: false
      secrets:
        # TWO SECRETS, NOT ONE. `azure` authorises the DATA files over abfss; `iceberg`
        # authorises the REST CATALOG. Both take the same storage.azure.com token.
        #
        # `persistent: true` IS WHAT MAKES THE CREDENTIAL REACH THE MODEL, and it is not
        # optional. dbt v2 defaults `persistent` to false, emits CREATE OR REPLACE SECRET
        # (session-scoped) and runs it on a temporary connection. The catalog ATTACH
        # survives that connection because attachments are database-scoped; a secret is
        # not. Without this the model's own connection reaches OneLake with no credential
        # and dies "could not open file '.../data' ... this could mean the credentials used
        # were wrong". Measured over four runs of the demo this was ported from.
        #
        # PERSISTENT writes the secret to ~/.duckdb, i.e. the token lands on disk. That is
        # acceptable here and ONLY here: this leg runs in a throwaway Fabric notebook whose
        # filesystem dies with the run. Do not lift this profile into anything that persists.
        - type: azure
          name: onelake_storage
          provider: access_token
          persistent: true
          access_token: "{{ env_var('ONELAKE_TOKEN') }}"
        - type: iceberg
          name: onelake_cat
          persistent: true
          token: "{{ env_var('ONELAKE_TOKEN') }}"
